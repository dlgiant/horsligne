<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors Ligne — Family Portal</title>
  <meta name="description" content="Secure family portal: session status, verified messages, gift bookings. Venue + city only — never GPS." />
  <!-- CSP: no inline scripts; API base set via config.js (see README) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:3000 https://api.horslign.earth; style-src 'self'; img-src 'self' data:; script-src 'self'" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='4' fill='none' stroke='%232e5e4e' stroke-width='2.5'/%3E%3Cline x1='13' y1='24' x2='19' y2='24' stroke='%232e5e4e' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <span class="brand">Hors&nbsp;Ligne <span class="brand-sub" data-i18n="portalTag">family portal</span></span>
      <div class="header-actions">
        <div class="lang-toggle" role="group" aria-label="Language / Idioma">
          <button type="button" data-lang="en" class="lang-btn">EN</button>
          <button type="button" data-lang="pt" class="lang-btn">PT</button>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-small" data-i18n="logout" hidden>Log out</button>
      </div>
    </div>
  </header>
  <main id="app" class="wrap">
    <noscript>This portal needs JavaScript. Your link and credentials still work — nothing is tracked.</noscript>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span data-i18n="footerNote">Venue + city only. Never your location. Per-trip access expires automatically.</span>
      <span class="copyright">© <span id="year">2026</span> Hors Ligne</span>
    </div>
  </footer>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
