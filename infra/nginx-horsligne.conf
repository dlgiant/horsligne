# Hors Ligne — nginx config (TLS via certbot). Install to
# /etc/nginx/sites-available/horsligne and symlink into sites-enabled.
# Static sites are served straight from the deployed repo; only /api/ hits Node.

# --- API ---
server {
    listen 443 ssl;
    server_name api.horslign.earth;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # RevenueCat signs the exact body — do not buffer/alter it
        proxy_request_buffering off;
        client_max_body_size 64k;
    }

    location / { return 404; }
}

# --- landing ---
server {
    listen 443 ssl;
    server_name horslign.earth www.horslign.earth;
    root /srv/horsligne/landing;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- portal ---
server {
    listen 443 ssl;
    server_name portal.horslign.earth;
    root /srv/horsligne/portal;
    index index.html;
    # SPA deep links (invite links are /#/p/<token>, but keep fallback anyway)
    location / { try_files $uri $uri/ /index.html; }
}

# --- admin console ---
server {
    listen 443 ssl;
    server_name admin.horslign.earth;
    root /srv/horsligne/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name horslign.earth www.horslign.earth portal.horslign.earth admin.horslign.earth api.horslign.earth;
    return 301 https://$host$request_uri;
}
